<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnforceWell</title>

    <link rel="icon" href="logo-ik.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #071a3d, #123b78, #35156b);
            color: white;
        }

        .container {
            padding: 40px 25px;
        }

        .logo {
            width: 110px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .status {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .message {
            color: #cbd5e1;
            font-size: 16px;
            line-height: 1.6;
        }

        .credit {
            margin-top: 50px;
            font-size: 14px;
            color: #94a3b8;
        }

        .credit a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: bold;
        }

        .credit a:hover {
            text-decoration: underline;
        }

        .loader {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid white;
            border-radius: 50%;
            margin: 30px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="logo-ik.png" class="logo" alt="Logo">

        <h1>EnforceWell</h1>

        <div class="status">
            Will Update Soon
        </div>

        <p class="message">
            This website is currently being updated.<br>
            Please check back soon.
        </p>

        <div class="loader"></div>

        <div class="credit">
            Created by
            <a href="https://ikjon.info" target="_blank">
                ikjon.info
            </a>
        </div>

    </div>

</body>
</html>
