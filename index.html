<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EnforceWell - PKD Kuala Selangor</title>

    <!-- Favicon -->
    <link rel="icon" href="logo-ik.png" type="image/png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #071a3d, #102c63);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .logo {
            width: 120px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        p {
            color: #cbd5e1;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .btn {
            display: inline-block;
            padding: 14px 28px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="logo-ik.png" class="logo" alt="EnforceWell Logo">

        <h1>EnforceWell</h1>

        <p>
            e-PTP PKD Kuala Selangor
            <br>
            Sistem Pengurusan Penguatkuasaan & Perundangan
        </p>

        <!-- Tukar URL ini kepada URL Google Apps Script kau -->
        <a href="https://script.google.com/macros/s/XXXXXXXXXXXX/exec"
           class="btn">
            Buka Sistem
        </a>

        <div class="footer">
            © 2026 EnforceWell · PKD Kuala Selangor
        </div>

    </div>

</body>
</html>
